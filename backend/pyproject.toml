[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires an explicit TEST_DATABASE_URL and a running PostgreSQL server"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["env", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
